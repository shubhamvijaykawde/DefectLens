# Encoder pinned in Phase 0c from the installed anomalib 2.7.0 source (signature default in both
# lightning_model.py and torch_model.py) and confirmed by a real forward pass:
# features (B, 324, 384) at 252x252 with patch size 14.
name: anomaly_dino
encoder_name: vit_small_patch14_dinov2
image_size: [252, 252]
num_neighbours: 1
masking: false
coreset_subsampling: false
batch_size: 16       # fitting (embedding extraction)
eval_batch_size: 2   # scoring; the kNN distance matrix is (batch x patches) x bank rows
shots: null          # null = all normal training images; an integer = fixed random k-shot subset

# EfficientAD-S (speed baseline), trained with our own loop (see anomaly/efficientad.py).
# EfficientAD has its own teacher/student network; there is no backbone option.
name: efficientad
model_size: small            # "small" or "medium"
teacher_out_channels: 384
pretrained_teacher: true     # anomalib's released teacher weights (downloaded once)
imagenet_dir: data/raw/imagenette   # Imagenette for the penalty loss (about 1.5 GB, git-ignored)
image_size: [256, 256]
max_steps: 70000             # the paper / anomalib default; use a small value for smoke runs
lr: 0.0001
weight_decay: 0.00001
train_batch_size: 1          # the method requires 1; any other value is an error
holdout_fraction: 0.1        # of the training normals, held out to compute the map quantiles
log_every: 100               # steps per logged loss point (mean over the window)
batch_size: 16               # only for loading the images; training itself uses batch size 1
eval_batch_size: 8           # scoring
shots: null                  # null = all normal training images

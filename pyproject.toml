[project]
name = "defectlens"
version = "0.1.0"
description = "Industrial visual inspection: supervised detector + anomaly detector, exported to ONNX and served."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anomalib==2.7.0",
    "transformers==5.22.1",
    "timm",
    "onnx",
    "onnxscript",
    "opencv-python-headless",
    "scikit-image",
    "albumentations",
    "pycocotools",
    "hydra-core",
    "mlflow",
    "dvc",
    "gdown>=6.5.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
# Local GPU env (default). torch and torchvision are pinned as a pair.
cu130 = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnxruntime-gpu[cuda]==1.31.1",
]
# CI env: same torch versions from the CPU index.
cpu = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnxruntime==1.31.1",
]
# Demo / API dependencies. The slim Docker image installs only this group (no torch).
serve = [
    "fastapi",
    "gradio",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.uv]
default-groups = ["cu130", "serve", "dev"]
conflicts = [
    [{ group = "cu130" }, { group = "cpu" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cpu", group = "cpu" },
]
torchvision = [
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cpu", group = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defectlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run skips tests marked slow (> 5 s each) to stay under 60 s. Run them with
# `pytest -m slow`, everything with `pytest -m ""`. Note: -m also applies to a test selected by
# node id, so a slow test needs `-m slow` there too. CI runs both (see .github/workflows/ci.yml).
addopts = "-q -m 'not slow'"
markers = ["slow: takes more than 5 s on CPU; excluded from the default run, run in CI"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
